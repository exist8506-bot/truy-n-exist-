name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check server/auth.js
          node --check server/server.js
          node --check api-client.js
          node --check books.js
          node --check app.js
      - name: Clean seed validation
        run: |
          test -f server/schema.sql
          test -f server/seed.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('server/seed.json','utf8'));
          if(!Array.isArray(d.books)||d.books.length!==3) throw new Error('Expected 3 clean demo stories');
          const chapters=d.books.reduce((n,b)=>n+(b.chapters||[]).length,0);
          if(chapters!==26) throw new Error('Expected 26 clean demo chapters');
          console.log({stories:d.books.length,chapters});
          NODE
      - name: Validate real public-domain seed when present
        run: |
          if [ -f server/public-domain-seed.json ]; then
            node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('server/public-domain-seed.json','utf8')); if(d.books.length!==10) throw new Error('Expected exactly 10 public-domain books'); const ids=['phong-than-dien-nghia','tay-du-ky','hau-tay-du-ky','dong-du-ky','nam-du-ky','bac-du-ky','bat-tien-dac-dao','nu-tien-ngoai-su','luc-da-tien-tung','tam-toai-binh-yeu-truyen']; for(const id of ids){const b=d.books?.find(x=>x.id===id); if(!b) throw new Error('Missing seed book '+id); if(b.status!=='FULL') throw new Error('Not FULL '+id); if(!Array.isArray(b.chapters)||!b.chapters.length) throw new Error('No chapters '+id); const short=b.chapters.filter(c=>String(c.content||'').trim().length<200); if(short.length) throw new Error('Short chapters '+id+': '+short.map(c=>c.index).join(','));} const feng=d.books.find(x=>x.id==='phong-than-dien-nghia'); if(feng.chapters.length!==100) throw new Error('Expected 100 Fengshen chapters'); console.log({books:d.books.length,chapters:d.books.reduce((n,b)=>n+b.chapters.length,0)});"
          else
            echo "public-domain-seed.json not generated yet; skipping"
          fi
      - name: 1.6 integration flow
        run: node server/integration.test.js
      - name: API edge validation
        run: node server/edge-validation.test.js
      - name: Start API smoke test
        run: |
          set +e
          node server/server.js > /tmp/kho-api.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "API failed to start:"
            cat /tmp/kho-api.log
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          curl -fsS 'http://127.0.0.1:8787/api/v1/stories?page=1&pageSize=10'
          curl -fsS 'http://127.0.0.1:8787/api/v1/stories/b1'
          curl -fsS http://127.0.0.1:8787/public-domain-seed.json -o /tmp/public-domain-seed.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/public-domain-seed.json','utf8')); const ids=['phong-than-dien-nghia','tay-du-ky','hau-tay-du-ky','dong-du-ky','nam-du-ky','bac-du-ky','bat-tien-dac-dao','nu-tien-ngoai-su','luc-da-tien-tung','tam-toai-binh-yeu-truyen']; for(const id of ids){const b=d.books?.find(x=>x.id===id);if(!b||b.status!=='FULL'||!b.chapters?.length)throw new Error('static HTTP seed missing '+id)} const feng=d.books.find(x=>x.id==='phong-than-dien-nghia');if(feng.chapters.length!==100)throw new Error('static HTTP Fengshen is not 100 chapters');console.log('static HTTP seed OK',d.books.length,d.books.reduce((n,b)=>n+b.chapters.length,0));"
          kill "$pid" 2>/dev/null || true
      - name: Frontend browser regression
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test --grep-invert "desktop end-to-end: library, reader, account, admin, offline|Vietnamese Unicode and reader font regression" tests --config=playwright.config.mjs
      - name: Docker build
        run: docker build -t kho-truyen-full:ci .
