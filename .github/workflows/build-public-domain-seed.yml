name: Build public-domain seed
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-public-domain-seed.mjs'
      - '.github/workflows/build-public-domain-seed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build seed from Wikisource
        run: node scripts/build-public-domain-seed.mjs
      - name: Prepare static seed
        run: cp server/public-domain-seed.json public-domain-seed.json
      - name: Validate generated seed
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('server/public-domain-seed.json','utf8')); const b=d.books?.find(x=>x.id==='phong-than-dien-nghia'); if(!b||b.chapters?.length!==100) throw new Error('Invalid real seed'); if(b.chapters.some(c=>String(c.content||'').trim().length<200)) throw new Error('Short chapter'); console.log('validated 100 chapters');"
      - name: Commit generated seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/public-domain-seed.json public-domain-seed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh real public-domain story"
          git push
