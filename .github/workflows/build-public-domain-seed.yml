name: Build public-domain seed
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-public-domain-seed.mjs'
      - '.github/workflows/build-public-domain-seed.yml'
  workflow_dispatch:
concurrency:
  group: build-public-domain-seed
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build seed from Wikisource
        run: node scripts/build-public-domain-seed.mjs
      - name: Prepare static seed
        run: cp server/public-domain-seed.json public-domain-seed.json
      - name: Validate generated seed
        run: |
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('server/public-domain-seed.json','utf8')); const ids=['phong-than-dien-nghia','tay-du-ky','hau-tay-du-ky','dong-du-ky','nam-du-ky','bac-du-ky','bat-tien-dac-dao','nu-tien-ngoai-su','luc-da-tien-tung','tam-toai-binh-yeu-truyen','kinh-hoa-duyen']; for(const id of ids){const b=d.books?.find(x=>x.id===id); if(!b||b.status!=='FULL'||!Array.isArray(b.chapters)||!b.chapters.length) throw new Error('Invalid seed '+id); if(b.chapters.some(c=>String(c.content||'').trim().length<200)) throw new Error('Short chapter '+id);} const feng=d.books.find(x=>x.id==='phong-than-dien-nghia'); if(feng.chapters.length!==100) throw new Error('Fengshen should have 100 chapters'); console.log('validated',d.books.length,'books /',d.books.reduce((n,b)=>n+b.chapters.length,0),'chapters');
          NODE
      - name: Commit generated seed
        run: |
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/public-domain-seed.json public-domain-seed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh real public-domain story"
          git push
