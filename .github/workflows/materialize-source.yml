name: Materialize staged source
on:
  push:
    paths:
      - 'source/*.gz'
      - '.github/workflows/materialize-source.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize server source
        run: |
          if [ -f source/server.js.gz ]; then
            gzip -dc source/server.js.gz > server/server.js
          fi
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git diff --cached --quiet || git commit -m "chore: materialize staged server source"
          git push
