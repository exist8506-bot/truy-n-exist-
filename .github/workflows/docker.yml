name: Build container
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'server/**'
      - 'app.js'
      - 'index.html'
      - 'api-client.js'
      - 'books.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'render.yaml'
      - '.github/workflows/docker.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kho-truyen-full:ci
